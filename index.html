<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rose Princess Palace</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcf8f2;
            --card-bg: #ffffff;
            --accent-gold: #d4af37;
            --border-gold: #e5c158;
            --text-primary: #5a4634;
            --text-secondary: #8c7355;
            --badge-off: #cbd5e1;
            --badge-on: #ef4444;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .palace-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 3px solid var(--border-gold);
            border-radius: 28px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
            box-sizing: border-box;
            text-align: center;
            position: relative;
        }

        .crown-icon {
            font-size: 28px;
            margin-bottom: -10px;
        }

        .avatar-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 15px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nickname {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background-color: var(--badge-off);
            color: #ffffff;
            margin-bottom: 20px;
        }

        .status-badge.live {
            background-color: var(--badge-on);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .info-box {
            border: 1.5px dashed var(--border-gold);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 12px;
            background-color: #fffdf9;
        }

        .info-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .info-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-all;
            white-space: pre-line;
        }

        .update-time {
            font-size: 11px;
            color: #a39382;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="palace-card">
        <div class="crown-icon">👑</div>
        
        <div class="avatar-wrapper">
            <img id="profile-img" class="avatar-img" src="" alt="Profile Image">
        </div>

        <div id="nickname" class="nickname">ROSE</div>
        <div class="sub-title">✨ 로즈 공주님의 공식 궁전 ✨</div>

        <div id="status-badge" class="status-badge">💤 공주님 휴식 중 (OFFLINE)</div>

        <!-- 팬 수 -->
        <div class="info-box">
            <div class="info-label">💖 왕국 백성 (팬 수)</div>
            <div id="fan-count" class="info-value">- 명</div>
        </div>

        <!-- 자기소개 -->
        <div class="info-box">
            <div class="info-label">📜 공주님의 자기소개</div>
            <div id="description" class="info-value">로딩 중...</div>
        </div>

        <!-- 공지사항 -->
        <div class="info-box">
            <div class="info-label">📜 공주님의 칙령 (공지사항)</div>
            <div id="notice" class="info-value">로딩 중...</div>
        </div>

        <div id="updated-at" class="update-time">동기화 시간: -</div>
    </div>

    <script>
        async function loadSpoonData() {
            try {
                // 캐시 방지를 위해 타임스탬프 쿼리 추가
                const response = await fetch(`./data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Data fetch failed");
                
                const data = await response.json();

                // UI 업데이트
                document.getElementById("profile-img").src = data.profile_img || "https://via.placeholder.com/120";
                document.getElementById("nickname").innerText = data.nickname.toUpperCase();
                document.getElementById("fan-count").innerText = `${data.fan_count.toLocaleString()}명`;
                document.getElementById("description").innerText = data.description || "등록된 자기소개가 없습니다.";
                document.getElementById("notice").innerText = data.notice || "등록된 공지사항이 없습니다.";
                document.getElementById("updated-at").innerText = `동기화 시간: ${data.updated_at} (KST)`;

                // 라이브 상태 변경
                const badge = document.getElementById("status-badge");
                if (data.is_live) {
                    badge.innerText = "🔴 공주님 방송 중 (ON AIR)";
                    badge.classList.add("live");
                } else {
                    badge.innerText = "💤 공주님 휴식 중 (OFFLINE)";
                    badge.classList.remove("live");
                }

            } catch (error) {
                console.error("Error loading data:", error);
            }
        }

        // 페이지 로드 시 실행
        loadSpoonData();
    </script>
</body>
</html>
